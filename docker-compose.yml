# 直接拉镜像跑，不需要本地有源码或 Dockerfile。
#
# 启动后浏览器访问 http://<这台机器的地址>:8097，用下面的账号密码登录。
# 配置（Emby 地址 / 令牌、OpenAI key 等）在网页里填，存在挂载卷的 config.json 里。
#
# 用法：docker compose up -d
services:
  emby-meta-editor:
    # 如果你的 Docker Hub 用户名不是 aag111，把这里换掉
    image: aag111/emby-meta-editor:latest
    container_name: emby-meta-editor
    restart: unless-stopped

    ports:
      # 界面自带访问认证（用户名 + 密码），所以映射到所有网卡是安全的 ——
      # 未登录只能看到登录页。只想本机用就改回 "127.0.0.1:8097:8097"。
      # 但**要暴露到公网必须自己在前面套 HTTPS 反代**：容器只跑 http。
      - "8097:8097"

    volumes:
      # 用命名卷：Docker 会按镜像里的属主建目录，第一次启动就能写，不用手工 chown。
      # 想改成宿主目录映射（方便直接看 config.json）就换成下面那行，并先执行
      #   mkdir -p ./data && sudo chown 1000:1000 ./data
      # （容器里是非 root 的 uid 1000）
      - emby-data:/data
      # - ./data:/data

    environment:
      # 访问这个界面的账号密码。不填也能起：容器会生成一个随机密码，
      # 用 `docker logs emby-meta-editor` 在第一屏就能看到。
      # 密码忘了就改这里再 up -d 一次 —— 这是唯一的找回入口（配置里只存派生值）。
      - EMBYME_AUTH_USER=admin
      - EMBYME_AUTH_PASSWORD=换成你自己的密码
      # 容器里不需要浏览器，-open=false 是镜像默认 CMD 带的，这里不用重复写
      - TZ=Asia/Shanghai

volumes:
  emby-data:
